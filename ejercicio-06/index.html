<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <title>Ejercicio 6 - Selectores CSS</title>
</head>
<body>
  <div class="card">
    <p>Párrafo dentro de una tarjeta (estilizado por selector descendiente <code>.card p</code>).</p>
    <span>Texto destacado dentro de la tarjeta</span>
  </div>

  <div id="destacado">
    <p>Párrafo dentro del div con ID "destacado".</p>
  </div>

  <div>
    <p class="nota">Párrafo con clase "nota" fuera de cualquier tarjeta.</p>
  </div>
</body>
</html>
