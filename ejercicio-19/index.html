<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <title>Ejercicio 19 - Formulario multi-step</title>
</head>
<body>
  <form class="registro" novalidate>
    <!-- Paso 1 -->
    <section id="paso1" class="paso">
      <h2>Paso 1: Datos personales</h2>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" required minlength="3">

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <a href="#paso2" class="btn-siguiente">Siguiente →</a>
    </section>

    <!-- Paso 2 -->
    <section id="paso2" class="paso">
      <h2>Paso 2: Cuenta</h2>
      <label for="usuario">Usuario:</label>
      <input type="text" id="usuario" required minlength="4">

      <label for="password">Contraseña:</label>
      <input type="password" id="password" required minlength="6">

      <a href="#paso1" class="btn-volver">← Volver</a>
      <button type="submit">Registrarme</button>
    </section>
  </form>
</body>
</html>
