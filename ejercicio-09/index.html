<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <title>Ejercicio 9 - Flexbox: galería de tarjetas</title>
</head>
<body>
  <h1>Nuestros productos</h1>
  <div class="galeria">
    <div class="producto">
      <img src="https://picsum.photos/id/1/200/150" alt="Producto 1">
      <h3>Producto 1</h3>
      <p>$1000</p>
      <button>Comprar</button>
    </div>
    <div class="producto">
      <img src="https://picsum.photos/id/2/200/150" alt="Producto 2">
      <h3>Producto 2</h3>
      <p>$1500</p>
      <button>Comprar</button>
    </div>
    <div class="producto">
      <img src="https://picsum.photos/id/3/200/150" alt="Producto 3">
      <h3>Producto 3</h3>
      <p>$800</p>
      <button>Comprar</button>
    </div>
    <div class="producto">
      <img src="https://picsum.photos/id/4/200/150" alt="Producto 4">
      <h3>Producto 4</h3>
      <p>$2200</p>
      <button>Comprar</button>
    </div>
    <div class="producto">
      <img src="https://picsum.photos/id/5/200/150" alt="Producto 5">
      <h3>Producto 5</h3>
      <p>$999</p>
      <button>Comprar</button>
    </div>
    <div class="producto">
      <img src="https://picsum.photos/id/6/200/150" alt="Producto 6">
      <h3>Producto 6</h3>
      <p>$1750</p>
      <button>Comprar</button>
    </div>
  </div>
</body>
</html>
