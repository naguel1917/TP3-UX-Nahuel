<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <title>Ejercicio 14 - Variables CSS y temas</title>
</head>
<body>
  <header class="header">
    <h1>Mi sitio con variables CSS</h1>
    <button id="btn-tema">Cambiar a modo oscuro</button>
  </header>

  <main class="contenido">
    <div class="card">Tarjeta con variables aplicadas</div>
    <p>Este texto usa la variable de espaciado y color secundario.</p>
  </main>

  <script>
    const boton = document.getElementById('btn-tema');
    boton.addEventListener('click', () => {
      document.body.classList.toggle('modo-oscuro');
    });
  </script>
</body>
</html>
